<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stratis Koukoulis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .video-wrap {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* Two video elements for crossfade */
    .video-wrap video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: opacity 1.5s ease;
    }

    #vid-a { opacity: 1; }
    #vid-b { opacity: 0; }

    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.72) 0%,
        rgba(0,0,0,0.35) 50%,
        rgba(0,0,0,0.0) 100%
      );
    }

    .content {
      position: fixed; inset: 0; z-index: 2;
      display: flex;
      align-items: center;
      padding-left: 9vw;
    }

    .title {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(2rem, 3.2vw, 3rem);
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.03em;
      opacity: 0;
      animation: fadeUp 1s 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: clamp(0.72rem, 1vw, 0.82rem);
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      opacity: 0;
      animation: fadeUp 1s 1s cubic-bezier(0.16,1,0.3,1) forwards;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cursor {
      width: 5px; height: 0.85em;
      background: rgba(255,255,255,0.35);
      display: inline-block;
      animation: blink 1.1s infinite;
      border-radius: 1px;
    }

    .flash {
      position: fixed; inset: 0; z-index: 100;
      background: white; opacity: 0;
      pointer-events: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="video-wrap">
    <video id="vid-a" muted playsinline>
      <source src="crystal.mp4" type="video/mp4">
    </video>
    <video id="vid-b" muted playsinline>
      <source src="crystal.mp4" type="video/mp4">
    </video>
  </div>

  <div class="overlay"></div>
  <div class="flash" id="flash"></div>

  <div class="content">
    <div>
      <div class="title">Welcome to<br>Stratis' Portfolio</div>
      <div class="subtitle">Press any key to continue <span class="cursor"></span></div>
    </div>
  </div>

  <script>
    const vidA = document.getElementById('vid-a');
    const vidB = document.getElementById('vid-b');
    let active = 'a'; // which video is currently visible

    // Start playing vid-a
    vidA.play();

    // How many seconds before end to start crossfade
    const CROSSFADE_BEFORE = 1.8;

    function checkTime(current, next) {
      current.addEventListener('timeupdate', function handler() {
        const remaining = current.duration - current.currentTime;
        if (remaining <= CROSSFADE_BEFORE && remaining > 0) {
          current.removeEventListener('timeupdate', handler);

          // Start next video from beginning
          next.currentTime = 0;
          next.play();

          // Crossfade
          current.style.opacity = '0';
          next.style.opacity = '1';

          // After crossfade done, reset current and swap
          setTimeout(() => {
            current.pause();
            current.currentTime = 0;

            // Now set up the next crossfade (reversed roles)
            if (active === 'a') {
              active = 'b';
              checkTime(vidB, vidA);
            } else {
              active = 'a';
              checkTime(vidA, vidB);
            }
          }, CROSSFADE_BEFORE * 1000 + 200);
        }
      });
    }

    // Kick off the loop once vid-a has duration
    vidA.addEventListener('loadedmetadata', () => {
      checkTime(vidA, vidB);
    });

    // Navigate on any key/click/touch
    let ready = false;
    setTimeout(() => { ready = true; }, 1600);

    function go() {
      if (!ready) return;
      const f = document.getElementById('flash');
      f.style.transition = 'opacity 0.12s';
      f.style.opacity = '0.15';
      setTimeout(() => { window.location.href = 'index.html'; }, 180);
    }

    document.addEventListener('keydown', go);
    document.addEventListener('click', go);
    document.addEventListener('touchstart', go);
  </script>
</body>
</html>
